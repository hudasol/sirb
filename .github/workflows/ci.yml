name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Regenerate viewer data and check it is deterministic
        run: |
          python scripts/build_viewer_data.py
          python scripts/check_viewer_data.py
          git status --short viewer/data | head -5 | sed 's/^/::warning::/'
