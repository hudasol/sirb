name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Regenerate viewer data, check determinism and PASS verdicts
        run: |
          python scripts/build_viewer_data.py
          python scripts/check_viewer_data.py
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean environment and run the command line
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/sirb --version || /tmp/clean/bin/python -m sirb --version
          /tmp/clean/bin/python -m sirb validate shows/sirb_text_100.json
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" playwright
      - run: playwright install --with-deps chromium
      - name: Keyboard, reduced motion, light theme, file protocol, RTL and overflow checks
        run: python scripts/viewer_checks.py --out "$RUNNER_TEMP/viewer_checks.json"
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Regenerate the documents from results and fail on drift
        run: |
          make docs
          python scripts/check_doc_numbers.py
          git diff --exit-code -- README.md docs
